name: QSOS Utilities

on:
  push:
    paths:
      - 'utilities/**'
      - '.github/workflows/qsos-utilities.yml'
  pull_request:
    paths:
      - 'utilities/**'

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: utilities
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo run -p qsos-cli --bin qsos -- lint --root ..
