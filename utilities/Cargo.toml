[workspace]
resolver = "2"
members = [
    "qsos-core",
    "qsos-lint",
    "qsos-graph",
    "qsos-ingest",
    "qsos-watch",
    "qsos-init",
    "qsos-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Rob Dooh"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
thiserror = "2"
walkdir = "2"
qsos-core = { path = "qsos-core" }
qsos-lint = { path = "qsos-lint" }
qsos-graph = { path = "qsos-graph" }
qsos-ingest = { path = "qsos-ingest" }
qsos-watch = { path = "qsos-watch" }
qsos-init = { path = "qsos-init" }
