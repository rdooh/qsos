<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMP dev tool — QSOS Artifact Graph Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .banner {
    background: #3d1300;
    border-bottom: 1px solid #f0883e;
    color: #ffa657;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  header h1 { font-size: 15px; color: #f0f6fc; margin-right: auto; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, select, button {
    background: #21262d;
    border: 1px solid #30363d;
    color: #c9d1d9;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
  }
  input { min-width: 180px; }
  button { cursor: pointer; }
  button:hover { background: #30363d; }
  .kinds { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 16px; background: #0d1117; border-bottom: 1px solid #21262d; }
  .kind-toggle { display: flex; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; }
  .kind-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #graph { flex: 1; min-height: 0; background: #010409; }
  #stats {
    position: fixed; bottom: 12px; left: 12px;
    background: rgba(22,27,34,0.92);
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.5;
    max-width: 260px;
    pointer-events: none;
  }
  #detail {
    position: fixed; bottom: 12px; right: 12px;
    background: rgba(22,27,34,0.92);
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.5;
    max-width: 320px;
    display: none;
  }
  .error { color: #ff7b72; padding: 24px; }
</style>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>
<div class="banner">⚠ Temporary dev tool — not load-bearing · local inspection only · permanent viz → Dev OS Visual Surface</div>
<header>
  <h1>QSOS Artifact Graph</h1>
  <div class="controls">
    <input id="search" type="search" placeholder="Search id or label…">
    <select id="ticketFilter"><option value="">All tickets</option></select>
    <button id="resetBtn">Reset view</button>
    <button id="reloadBtn">Reload graph</button>
  </div>
</header>
<div class="kinds" id="kindToggles"></div>
<div id="graph"></div>
<div id="stats"></div>
<div id="detail"></div>

<script>
const COLORS = {
  ticket:      '#58a6ff',
  feature:     '#3fb950',
  scenario:    '#8b949e',
  adr:         '#d2a8ff',
  dsl_element: '#f0883e',
  contract:    '#ffa657',
  default:     '#6e7681',
};

let raw = { nodes: [], edges: [] };
let network = null;
let enabledKinds = new Set();
let focusNode = null;

function shortLabel(node) {
  if (node.kind === 'scenario') {
    const parts = node.id.split('::');
    return parts[parts.length - 1].slice(0, 40);
  }
  return (node.label || node.id).slice(0, 48);
}

function buildKindToggles(kinds) {
  const el = document.getElementById('kindToggles');
  el.innerHTML = '';
  kinds.forEach(kind => {
    enabledKinds.add(kind);
    const label = document.createElement('label');
    label.className = 'kind-toggle';
    label.innerHTML = `<span class="kind-dot" style="background:${COLORS[kind] || COLORS.default}"></span><input type="checkbox" data-kind="${kind}" checked> ${kind}`;
    label.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) enabledKinds.add(kind); else enabledKinds.delete(kind);
      render();
    });
    el.appendChild(label);
  });
}

function buildTicketFilter() {
  const sel = document.getElementById('ticketFilter');
  const current = sel.value;
  sel.innerHTML = '<option value="">All tickets</option>';
  raw.nodes.filter(n => n.kind === 'ticket').forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = t.id;
    sel.appendChild(opt);
  });
  sel.value = current;
}

function visibleNodeIds() {
  const search = document.getElementById('search').value.trim().toLowerCase();
  const ticket = document.getElementById('ticketFilter').value;
  let allowed = new Set();

  if (ticket) {
    const queue = [ticket];
    allowed.add(ticket);
    while (queue.length) {
      const cur = queue.pop();
      raw.edges.forEach(e => {
        if (e.from === cur && allowed.add(e.to)) queue.push(e.to);
        if (e.to === cur && allowed.add(e.from)) queue.push(e.from);
      });
    }
  }

  return raw.nodes.filter(n => {
    if (!enabledKinds.has(n.kind)) return false;
    if (ticket && !allowed.has(n.id)) return false;
    if (search) {
      const hay = `${n.id} ${n.label} ${n.kind}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  }).map(n => n.id);
}

function render() {
  const ids = new Set(visibleNodeIds());
  const nodes = raw.nodes.filter(n => ids.has(n.id)).map(n => ({
    id: n.id,
    label: shortLabel(n),
    title: `<b>${n.kind}</b><br>${n.id}<br>${n.label}`,
    color: {
      background: COLORS[n.kind] || COLORS.default,
      border: focusNode === n.id ? '#f0f6fc' : '#010409',
      highlight: { background: '#f0f6fc', border: '#010409' },
    },
    font: { color: '#f0f6fc', size: n.kind === 'ticket' ? 13 : 10 },
    shape: n.kind === 'ticket' ? 'box' : n.kind === 'adr' ? 'diamond' : 'dot',
    size: n.kind === 'ticket' ? 18 : n.kind === 'feature' ? 14 : 10,
  }));

  const edges = raw.edges.filter(e => ids.has(e.from) && ids.has(e.to)).map((e, i) => ({
    id: i,
    from: e.from,
    to: e.to,
    title: e.kind,
    arrows: 'to',
    color: { color: '#30363d', highlight: '#58a6ff' },
    width: focusNode && (e.from === focusNode || e.to === focusNode) ? 2 : 1,
    font: { size: 0, align: 'middle' },
  }));

  const container = document.getElementById('graph');
  const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
  const options = {
    physics: {
      stabilization: { iterations: 120 },
      barnesHut: { gravitationalConstant: -8000, springLength: 120 },
    },
    interaction: { hover: true, tooltipDelay: 120 },
    layout: { improvedLayout: nodes.length < 120 },
  };

  if (network) network.destroy();
  network = new vis.Network(container, data, options);

  network.on('click', params => {
    if (params.nodes.length) {
      focusNode = params.nodes[0];
      const n = raw.nodes.find(x => x.id === focusNode);
      const detail = document.getElementById('detail');
      detail.style.display = 'block';
      detail.innerHTML = `<b>${n.kind}</b><br><code>${n.id}</code><br>${n.label}`;
      render();
    } else {
      focusNode = null;
      document.getElementById('detail').style.display = 'none';
      render();
    }
  });

  document.getElementById('stats').innerHTML =
    `Showing <b>${nodes.length}</b> nodes · <b>${edges.length}</b> edges<br>` +
    `Total registry: ${raw.nodes.length} nodes · ${raw.edges.length} edges`;
}

async function loadGraph() {
  const urls = ['/api/graph', '/work/graph-registry.json', '../work/graph-registry.json'];
  let lastErr = null;
  for (const url of urls) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${url} → ${res.status}`);
      raw = await res.json();
      const kinds = [...new Set(raw.nodes.map(n => n.kind))].sort();
      buildKindToggles(kinds);
      buildTicketFilter();
      render();
      return;
    } catch (e) { lastErr = e; }
  }
  document.getElementById('graph').innerHTML =
    `<div class="error">Could not load graph-registry.json.<br><br>` +
    `Run:<br><code>cargo run -p qsos-cli --bin qsos -- graph compile --root ..</code><br>` +
    `Then:<br><code>python3 utilities/serve.py</code><br><br>${lastErr}</div>`;
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('ticketFilter').addEventListener('change', render);
document.getElementById('resetBtn').addEventListener('click', () => {
  focusNode = null;
  document.getElementById('search').value = '';
  document.getElementById('ticketFilter').value = '';
  document.getElementById('detail').style.display = 'none';
  render();
  if (network) network.fit();
});
document.getElementById('reloadBtn').addEventListener('click', loadGraph);

loadGraph();
</script>
</body>
</html>
